<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14507a">
  <title>Caisse — Mam Sira</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Écran 0 — Premier lancement (config du poste) -->
  <section id="screen-config" class="screen" hidden>
    <div class="config-box">
      <h1>Mam Sira</h1>
      <p>Caisse mobile</p>
      <label for="poste-input">Nom de ce poste</label>
      <input id="poste-input" type="text" placeholder="Aminata, Poste 2…" autocomplete="off" inputmode="text">
      <button id="poste-valider" class="btn btn-primary btn-block">Démarrer</button>
    </div>
  </section>

  <!-- Écran 1 — Caisse -->
  <section id="screen-caisse" class="screen" hidden>
    <div class="produits-zone" id="produits-zone"><!-- grille injectée par JS --></div>

    <aside class="panier" id="panier-zone">
      <div class="panier-lignes" id="panier-lignes"></div>
    </aside>

    <div class="barre-encaissement">
      <input id="note-input" class="note-input" type="text" autocomplete="off"
             placeholder="Note (optionnel) — ex. Amadou, paie dimanche">
      <div class="total-ligne">
        <span class="total-label">Total</span>
        <span class="total-montant" id="total-caisse">0,00 €</span>
        <button id="btn-annuler" class="btn-annuler">Annuler</button>
      </div>
      <div class="encaissement-boutons">
        <button id="btn-cb" class="btn btn-cb">CB</button>
        <button id="btn-especes" class="btn btn-especes">Espèces</button>
        <button id="btn-plustard" class="btn btn-plustard">Plus tard</button>
      </div>
    </div>
  </section>

  <!-- Écran 2 — Encaissement espèces -->
  <section id="screen-especes" class="screen" hidden>
    <div class="especes-haut">
      <div class="especes-bloc">
        <span class="especes-label">À payer</span>
        <span class="especes-du" id="especes-du">0,00 €</span>
      </div>
      <div class="especes-bloc">
        <span class="especes-label">Reçu</span>
        <span class="especes-recu" id="especes-recu">0,00 €</span>
      </div>
      <div class="especes-bloc especes-rendu-bloc">
        <span class="especes-label">À rendre</span>
        <span class="especes-rendu" id="especes-rendu">0,00 €</span>
      </div>
    </div>

    <div class="raccourcis" id="especes-raccourcis"><!-- boutons appoint/billets --></div>

    <div class="pave-num" id="pave-num"><!-- pavé injecté par JS --></div>

    <div class="especes-actions">
      <button id="especes-retour" class="btn btn-neutre">Retour</button>
      <button id="especes-encaisser" class="btn btn-primary" disabled>Encaisser</button>
    </div>
  </section>

  <!-- Écran 3 — Historique -->
  <section id="screen-historique" class="screen" hidden>
    <h2 class="screen-titre">Historique du jour</h2>
    <div class="liste" id="historique-liste"></div>
  </section>

  <!-- Écran 4 — Bilan -->
  <section id="screen-bilan" class="screen" hidden>
    <div class="bilan-entete">
      <h2 class="screen-titre">Bilan</h2>
      <select id="bilan-jour" class="select-jour"></select>
    </div>
    <div class="bilan-contenu" id="bilan-contenu"></div>
  </section>

  <!-- Écran 5 — Export -->
  <section id="screen-export" class="screen" hidden>
    <h2 class="screen-titre">Export</h2>
    <select id="export-jour" class="select-jour"></select>
    <p class="export-info" id="export-info"></p>
    <button id="export-csv" class="btn btn-primary btn-block">Exporter CSV</button>
    <button id="export-json" class="btn btn-neutre btn-block">Exporter JSON</button>
  </section>

  <!-- Navigation bas -->
  <nav class="nav-bas" id="nav-bas" hidden>
    <button class="nav-btn" data-screen="caisse">Caisse</button>
    <button class="nav-btn" data-screen="historique">Historique</button>
    <button class="nav-btn" data-screen="bilan">Bilan</button>
    <button class="nav-btn" data-screen="export">Export</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
