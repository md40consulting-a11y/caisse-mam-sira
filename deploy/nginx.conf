# Conf nginx pour servir l'app statique (PWA). Le HTTPS est géré en amont par NPM.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Types corrects (les modules JS doivent être servis en text/javascript).
    include /etc/nginx/mime.types;

    # Le Service Worker ne doit jamais être mis en cache par le navigateur,
    # sinon les mises à jour de l'app ne sont pas prises en compte.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # SPA simple : si la ressource n'existe pas, renvoyer index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
